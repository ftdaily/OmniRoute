[Unit]
Description=OmniRoute fork P2 RAM tuning (Beta): warn log level, 2 GB heap cap, slowed background timers

[Service]
# 2.1: silence per-request combo-trace JSON at idle (APP_LOG_LEVEL read in
# src/lib/logEnv.ts; default info unchanged when this drop-in is absent).
Environment=APP_LOG_LEVEL=warn
# 2.2: heap cap 4096 -> 2048. PROVEN (2026-11-09): the node CLI flag beats
# NODE_OPTIONS env (4496293888 with both set), so this line is IGNORED on any
# unit whose ExecStart hardcodes --max-old-space-size (current beta unit does).
# It takes effect on flag-free units (2b server unit). Real Beta activation =
# user edits ExecStart or adopts the 2b unit; this line documents the target.
Environment=NODE_OPTIONS=--max-old-space-size=2048
# 2.3: slow the no-knob timers (defaults unchanged when unset).
Environment=OMNIROUTE_TOKEN_HEALTH_CHECK_INTERVAL_MS=300000
Environment=OMNIROUTE_SUBSCRIPTION_SCHEDULER_INTERVAL_MS=300000
Environment=OMNIROUTE_WARMUP_TICK_INTERVAL_MS=300000
