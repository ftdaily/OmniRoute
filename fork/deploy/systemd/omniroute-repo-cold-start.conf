# 2026-11-09 cold start: omniroute-prod.socket owns :20128 and wakes this unit.
# Rollback: delete this file, disable omniroute-prod.socket, enable --now omniroute-repo.
[Unit]
BindsTo=omniroute-prod-proxy.service

[Service]
TimeoutStartSec=120
Environment=PORT=20138
Environment=OMNIROUTE_PORT=20138
Environment=OMNIROUTE_HOSTNAME=127.0.0.1
ExecStartPost=/bin/sh -c 'for i in $(seq 1 110); do [ "$(curl -s -o /dev/null -w "%%{http_code}" --max-time 2 http://127.0.0.1:20138/api/health)" = 200 ] && exit 0; sleep 1; done; exit 1'
